<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#6558D3" />
    <meta name="description" content="Ledgerly — a shared personal finance tracker" />

    <!-- iOS "Add to Home Screen" support (Safari does not read the web manifest for these) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ledgerly" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Ledgerly</title>
    <script>
      // Applies the last-known theme before React mounts, so there's no
      // light-mode flash on load. Re-synced against the signed-in user's
      // saved preference (source of truth) once the app loads.
      (function () {
        try {
          var mode = localStorage.getItem('ledgerly-theme-mode') || 'system';
          var accent = localStorage.getItem('ledgerly-theme-accent') || 'violet';
          var isDark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', isDark);
          document.documentElement.setAttribute('data-accent', accent);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
