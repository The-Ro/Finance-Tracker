<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- The iPhone status bar strip takes this colour (ThemeContext keeps it in step with light/dark). -->
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="LedgeEaze — a shared personal finance tracker" />

    <!-- iOS "Add to Home Screen" support (Safari does not read the web manifest for these) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- "default", not "black-translucent": with the page drawn under the status bar, iOS put its own blur over the top of the app ("blurry on top"). Now the status bar is its own solid strip. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="LedgeEaze" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-180.png" />

    <!-- A real /favicon.ico matters: without it the SPA fallback answered with HTML, and Safari's tab overview showed a letter "L" tile. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <title>LedgeEaze</title>
    <script>
      // Applies the last-known theme before React mounts, so there's no
      // light-mode flash on load. Re-synced against the signed-in user's
      // saved preference (source of truth) once the app loads.
      (function () {
        try {
          var mode = localStorage.getItem('ledgerly-theme-mode') || 'system';
          var accent = localStorage.getItem('ledgerly-theme-accent') || 'oxblood';
          var isDark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', isDark);
          document.documentElement.setAttribute('data-accent', accent);
          var custom = accent === 'custom' && JSON.parse(localStorage.getItem('ledgerly-theme-custom') || 'null');
          if (custom) {
            var st = document.documentElement.style;
            st.setProperty('--accent', custom[0]);
            st.setProperty('--accent-light', custom[1]);
            st.setProperty('--accent-dark', custom[2]);
          }
          // The coin is gold unless the user chose to match their theme.
          document.documentElement.setAttribute('data-coin', localStorage.getItem('ledgerly-coin') === 'theme' ? 'theme' : 'gold');
          var bar = document.querySelector('meta[name="theme-color"]');
          if (bar) bar.setAttribute('content', isDark ? '#1e2129' : '#ffffff');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
